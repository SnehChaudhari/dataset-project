<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Retail Store - Orders</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        {% include 'nav.html' %}

        <h1>Customer Orders</h1>

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Order Date</th>
                    <th>Customer ID</th>
                    <th>Total Amount</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders%}
                <tr>
                    <td>{{ order[0]}}</td>
                    <td>{{ order[1]}}</td>
                    <td>{{ order[2]}}</td>
                    <td>{{ order[3]}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
